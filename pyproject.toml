[project]
name = "video-analysis"
version = "0.2.0"
description = "Standalone dimension-based temporal video analysis engine"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "pydantic>=2.7,<3",
  "opencv-python-headless>=4.9,<5",
]

[project.optional-dependencies]
scenes = ["scenedetect[opencv]>=0.6.4,<1"]
gemini = ["google-genai>=1.0.0"]
dev = ["pytest>=8,<9", "ruff>=0.5"]

[project.scripts]
video-analysis = "video_analysis.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
